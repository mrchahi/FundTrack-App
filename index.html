    <script>
      // In AI Studio iframe environment, HMR WebSocket is disabled.
      // Stub the vite-hmr socket and suppress unhandled WebSocket errors.
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        window.WebSocket = function (url, protocols) {
          var isHmr =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (typeof url === 'string' && (url.indexOf(':24678') !== -1 || url.indexOf('token=') !== -1));
          if (isHmr) {
            var listeners = {};
            return {
              readyState: 1,
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              url: url,
              protocol: protocols || '',
              send: function () {},
              close: function () {},
              addEventListener: function (type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function () { fn({ type: 'open' }); }, 0);
                }
              },
              removeEventListener: function (type, fn) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function (cb) { return cb !== fn; });
                }
              },
              dispatchEvent: function () { return true; }
            };
          }
          return new OrigWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OrigWebSocket.prototype;
        window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        window.WebSocket.OPEN = OrigWebSocket.OPEN;
        window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
        window.WebSocket.CLOSED = OrigWebSocket.CLOSED;

        window.addEventListener('error', function (e) {
          if (e && e.message && /WebSocket/i.test(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason && /WebSocket/i.test(String(e.reason))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
